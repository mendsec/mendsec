name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      # Both jobs commit to the same branch, so they must not overlap.
      max-parallel: 1
      matrix:
        include:
          # The classic template is theme-neutral (grey on transparent);
          # the dark variant lifts text and links to GitHub's dark palette.
          - theme: light
            css: ""
          - theme: dark
            css: |
              svg { color: #c9d1d9; }
              svg svg { fill: #8b949e; }
              a { color: #58a6ff; }
    steps:
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: overview-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: header, activity, community, repositories
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}

      - name: Calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: calendar-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: ""
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  languages:
    # Runs after metrics so the two never push to the metrics branch at once.
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: metrics
          path: out
      - name: Render
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 src/.github/scripts/languages.py out
      - name: Commit
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update languages cards - [Skip GitHub Action]"
          git push
