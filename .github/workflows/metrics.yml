name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      # Both jobs commit to the same branch, so they must not overlap.
      max-parallel: 1
      matrix:
        include:
          # The classic template is theme-neutral (grey on transparent);
          # the dark variant lifts text and links to GitHub's dark palette.
          - theme: light
            css: ""
          - theme: dark
            css: |
              svg { color: #c9d1d9; }
              svg svg { fill: #8b949e; }
              a { color: #58a6ff; }
    steps:
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: overview-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: header, activity, community, repositories
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: languages-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: ""
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used

      - name: Calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: calendar-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: ""
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
