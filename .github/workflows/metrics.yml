name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      # Both jobs commit to the same branch, so they must not overlap.
      max-parallel: 1
      matrix:
        include:
          # The classic template is theme-neutral (grey on transparent);
          # the dark variant lifts text and links to GitHub's dark palette.
          - theme: light
            css: ""
          - theme: dark
            css: |
              svg { color: #c9d1d9; }
              svg svg { fill: #8b949e; }
              a { color: #58a6ff; }
    steps:
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: overview-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: header, activity, community, repositories
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: languages-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: ""
          # Most Go lives in org repos, so count orgs too, but only an
          # allowlist: membership in large orgs would otherwise dominate.
          # metrics v3.34 only ever fetches the first page (it stops when a page
          # is smaller than `repositories`, and never retries after halving a
          # batch that timed out), so both must match and fit in one request.
          # 50 times out; 45 misses only the 6 oldest of 51 repos.
          repositories: 45
          repositories_batch: 45
          repositories_affiliations: owner, organization_member
          repositories_skipped: |
            @use.patterns
            -*/*
            +mendsec/*
            +catnet-io/*
            +barahn/*
            +fabrintek/*
            +MadeiraHackerSpace/*
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used

      - name: Calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: mendsec
          filename: calendar-${{ matrix.theme }}.svg
          committer_branch: metrics
          base: ""
          config_timezone: Europe/Lisbon
          extras_css: ${{ matrix.css }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
